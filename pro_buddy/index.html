    <meta name="description" content="Pro Buddy — AI-powered project idea evaluation platform. From Confusion to Execution." />
    <title>Pro Buddy — Confusion to Execution</title>
    <script>
      window.addEventListener('error', function(e) {
        fetch('/api/log-error', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: e.message, filename: e.filename, lineno: e.lineno, error: e.error?.stack }) });
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('/api/log-error', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: e.reason?.message, stack: e.reason?.stack }) });
      });
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

  </body>
</html>
